name: Backend security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privilege-model:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Validate shell syntax
        run: |
          find scripts tests -type f -name '*.sh' -exec sh -n {} +
      - name: Check privilege model regression
        run: sh tests/test-privilege-model.sh
