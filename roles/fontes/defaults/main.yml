---
fontes_pacotes:
  - fontconfig
  - font-dejavu          # fallback universal
  - font-liberation      # compatível com Arial/Times/Courier
  - font-noto            # cobertura ampla (latino, etc.)
  - font-noto-emoji      # emojis
  - font-noto-cjk        # chinês/japonês/coreano
  - font-noto-extra      # alfabetos e símbolos adicionais
  - font-inter           # UI moderna
  - font-jetbrains-mono  # terminal/código
