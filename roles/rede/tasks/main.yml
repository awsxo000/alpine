---
- name: Instalar NetworkManager
  community.general.apk:
    name: "{{ rede_pacotes }}"
    state: present

- name: Habilitar eudev
  ansible.builtin.service:
    name: udev
    enabled: true
    state: started
  failed_when: false

- name: Adicionar usuário desktop ao grupo plugdev
  ansible.builtin.user:
    name: "{{ usuario_desktop }}"
    groups: "{{ rede_grupo_usuario }}"
    append: true

- name: Configurar NetworkManager
  ansible.builtin.template:
    src: NetworkManager.conf.j2
    dest: /etc/NetworkManager/NetworkManager.conf
    mode: "0644"
  notify: Reiniciar NetworkManager

- name: Parar e desabilitar serviços de rede legados
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [networking, wpa_supplicant]
  when: rede_desabilitar_servicos_legados | bool
  failed_when: false

- name: Habilitar NetworkManager
  ansible.builtin.service:
    name: networkmanager
    enabled: true
    state: started
