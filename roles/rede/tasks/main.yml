---
- name: Instalar NetworkManager
  community.general.apk:
    name: "{{ rede_pacotes }}"
    state: present

- name: Habilitar eudev
  ansible.builtin.service:
    name: udev
    enabled: true
    state: started
  failed_when: false

- name: Adicionar usuário desktop ao grupo plugdev
  ansible.builtin.user:
    name: "{{ usuario_desktop }}"
    groups: "{{ rede_grupo_usuario }}"
    append: true

- name: Configurar NetworkManager
  ansible.builtin.template:
    src: NetworkManager.conf.j2
    dest: /etc/NetworkManager/NetworkManager.conf
    mode: "0644"
  notify: Reiniciar NetworkManager

- name: Parar e desabilitar serviços de rede legados
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [networking, wpa_supplicant]
  when: rede_desabilitar_servicos_legados | bool
  failed_when: false

- name: Remover networking dos runlevels do OpenRC
  ansible.builtin.command: rc-update del networking {{ item }}
  loop: [boot, default]
  when: rede_desabilitar_servicos_legados | bool
  changed_when: false
  failed_when: false

- name: Remover wpa_supplicant standalone dos runlevels do OpenRC
  ansible.builtin.command: rc-update del wpa_supplicant {{ item }}
  loop: [boot, default]
  when: rede_desabilitar_servicos_legados | bool
  changed_when: false
  failed_when: false

- name: Habilitar NetworkManager
  ansible.builtin.service:
    name: networkmanager
    enabled: true
    state: started

- name: Verificar estado do serviço NetworkManager
  ansible.builtin.command: rc-service networkmanager status
  register: rede_status_networkmanager
  changed_when: false
  failed_when: false

- name: Consultar estado geral do NetworkManager
  ansible.builtin.command: nmcli general status
  register: rede_status_nmcli
  changed_when: false
  failed_when: false

- name: Consultar dispositivos gerenciados pelo NetworkManager
  ansible.builtin.command: nmcli device status
  register: rede_dispositivos_nmcli
  changed_when: false
  failed_when: false

- name: Exibir diagnóstico do NetworkManager
  ansible.builtin.debug:
    msg:
      - "{{ rede_status_networkmanager.stdout | default('status unavailable') }}"
      - "{{ rede_status_nmcli.stdout | default('nmcli unavailable') }}"
      - "{{ rede_dispositivos_nmcli.stdout | default('device list unavailable') }}"
