---
- name: Instalar utilitários para administrar a swap
  community.general.apk:
    name: "{{ swap_pacotes }}"
    state: present

- name: Consultar o arquivo de swap adicional
  ansible.builtin.stat:
    path: "{{ swapfile_caminho }}"
  register: swapfile_stat

- name: Consultar espaço livre na partição raiz
  ansible.builtin.command: df -Pk /
  register: swap_df
  changed_when: false

- name: Impedir criação sem espaço livre reservado
  ansible.builtin.assert:
    that:
      - (swap_df.stdout_lines[1].split()[3] | int) >= ((swapfile_tamanho_gib + swapfile_reserva_livre_gib) * 1048576)
    fail_msg: >-
      Espaço livre insuficiente em /. São necessários pelo menos
      {{ swapfile_tamanho_gib + swapfile_reserva_livre_gib }} GiB para criar
      {{ swapfile_caminho }} e manter a reserva de segurança.

- name: Recusar swapfile existente menor que o tamanho configurado
  ansible.builtin.assert:
    that:
      - swapfile_stat.stat.size >= (swapfile_tamanho_gib * 1073741824)
    fail_msg: >-
      {{ swapfile_caminho }} já existe com tamanho insuficiente. Nenhum arquivo
      será apagado ou redimensionado automaticamente.
  when: swapfile_stat.stat.exists

- name: Criar swapfile adicional
  ansible.builtin.command: "fallocate -l {{ swapfile_tamanho_gib }}G {{ swapfile_caminho }}"
  when: not swapfile_stat.stat.exists

- name: Restringir acesso à swapfile
  ansible.builtin.file:
    path: "{{ swapfile_caminho }}"
    owner: root
    group: root
    mode: '0600'

- name: Verificar assinatura da swapfile
  ansible.builtin.command: "blkid -o value -s TYPE {{ swapfile_caminho }}"
  register: swapfile_tipo
  changed_when: false
  failed_when: false

- name: Inicializar a swapfile
  ansible.builtin.command: "mkswap -L alpine-swapfile {{ swapfile_caminho }}"
  when: swapfile_tipo.stdout | trim != 'swap'

- name: Registrar a swapfile no fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^{{ swapfile_caminho | regex_escape }}[[:space:]]'
    line: "{{ swapfile_caminho }} none swap defaults,pri={{ swapfile_prioridade }} 0 0"
    state: present
    create: true
    owner: root
    group: root
    mode: '0644'

- name: Consultar swaps ativas
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_ativas
  changed_when: false
  failed_when: false

- name: Ativar a swapfile sem reiniciar
  ansible.builtin.command: "swapon --priority {{ swapfile_prioridade }} {{ swapfile_caminho }}"
  when: swapfile_caminho not in swap_ativas.stdout_lines

- name: Configurar hibernação dinamicamente quando habilitada
  when: energia_habilitar_hibernacao | default(false) | bool
  block:
    - name: Localizar o dispositivo que contém a raiz
      ansible.builtin.command: findmnt -no SOURCE /
      register: swap_raiz_dispositivo
      changed_when: false

    - name: Obter UUID atual da partição raiz
      ansible.builtin.command: "blkid -o value -s UUID {{ swap_raiz_dispositivo.stdout | trim }}"
      register: swap_raiz_uuid
      changed_when: false

    - name: Localizar o executável filefrag
      ansible.builtin.shell: command -v filefrag
      args:
        executable: /bin/sh
      register: swap_filefrag_bin
      changed_when: false
      failed_when: false

    - name: Exigir filefrag para calcular o offset do swapfile
      ansible.builtin.assert:
        that:
          - swap_filefrag_bin.rc == 0
        fail_msg: >-
          O comando filefrag não está disponível. O pacote
          e2fsprogs-extra é necessário para configurar a retomada da hibernação.

    - name: Calcular o primeiro offset físico do swapfile
      ansible.builtin.shell: >-
        {{ swap_filefrag_bin.stdout | trim }} -v {{ swapfile_caminho | quote }} |
        awk '$1 ~ /^0:$/ {gsub(/\.\./, "", $4); print $4; exit}'
      args:
        executable: /bin/sh
      register: swapfile_resume_offset
      changed_when: false

    - name: Validar dados de retomada descobertos
      ansible.builtin.assert:
        that:
          - swap_raiz_dispositivo.stdout | trim | length > 0
          - swap_raiz_uuid.stdout | trim | length > 0
          - swapfile_resume_offset.stdout | trim | int > 0
        fail_msg: >-
          Não foi possível descobrir dispositivo, UUID da raiz ou offset físico
          do swapfile. A hibernação não será configurada automaticamente.

    - name: Verificar se o GRUB possui configuração editável
      ansible.builtin.stat:
        path: /etc/default/grub
      register: swap_grub_defaults

    - name: Verificar se grub-mkconfig está disponível
      ansible.builtin.shell: command -v grub-mkconfig
      args:
        executable: /bin/sh
      register: swap_grub_mkconfig
      changed_when: false
      failed_when: false

    - name: Exigir GRUB configurável para habilitar hibernação
      ansible.builtin.assert:
        that:
          - swap_grub_defaults.stat.exists
          - swap_grub_mkconfig.rc == 0
        fail_msg: >-
          Hibernação habilitada, mas /etc/default/grub ou grub-mkconfig não está
          disponível. Nenhuma configuração de boot foi alterada.

    - name: Verificar se os parâmetros resume atuais já estão corretos
      ansible.builtin.shell: >-
        grep -Fq
        'resume=UUID={{ swap_raiz_uuid.stdout | trim }} resume_offset={{ swapfile_resume_offset.stdout | trim }}'
        /etc/default/grub
      args:
        executable: /bin/sh
      register: swap_resume_atual
      changed_when: false
      failed_when: false

    - name: Remover parâmetros resume antigos do GRUB
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '[[:space:]]+resume(?:_offset)?=[^"[:space:]]+'
        replace: ''
        backup: true
      when: swap_resume_atual.rc != 0

    - name: Adicionar parâmetros resume dinâmicos ao GRUB
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="([^"]*)"$'
        replace: >-
          GRUB_CMDLINE_LINUX_DEFAULT="\g<1> resume=UUID={{ swap_raiz_uuid.stdout | trim }}
          resume_offset={{ swapfile_resume_offset.stdout | trim }}"
        backup: true
      when: swap_resume_atual.rc != 0

    - name: Reconstruir configuração do GRUB
      ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
      register: swap_grub_resultado
      changed_when: true
      when: swap_resume_atual.rc != 0

    - name: Exibir parâmetros de retomada configurados
      ansible.builtin.debug:
        msg:
          - "resume=UUID={{ swap_raiz_uuid.stdout | trim }}"
          - "resume_offset={{ swapfile_resume_offset.stdout | trim }}"
      when: desktop_mostrar_diagnosticos | default(false) | bool

- name: Exibir o resultado da configuração de swap
  ansible.builtin.command: swapon --show
  register: swap_resultado
  changed_when: false

- name: Diagnóstico da swap
  ansible.builtin.debug:
    msg: "{{ swap_resultado.stdout_lines }}"
  when: desktop_mostrar_diagnosticos | default(false) | bool
