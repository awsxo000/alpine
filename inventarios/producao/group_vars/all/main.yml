---
# Premissa: Alpine JÁ instalado (setup-alpine + setup-desktop).
# O Ansible só adiciona a camada de pacotes extras (Nix) e ajustes.

# Usuário que já existe no sistema e usará o Nix.
# NÃO defina aqui: scripts/preparar-ansible.sh detecta o usuário da máquina e grava
# `usuario_desktop` em inventarios/producao/host_vars/localhost.yml.
usuario_desktop_home: "/home/{{ usuario_desktop }}"
desktop_mostrar_diagnosticos: false    # use make diagnostico para exibir detalhes

# ===== Nix =====
nix_canal_nome: nixpkgs
# Canal ESTÁVEL. Ao sair a próxima release (YY.05 / YY.11), basta trocar a versão aqui.
nix_canal_versao: "26.05"
nix_canal_url: "https://nixos.org/channels/nixos-{{ nix_canal_versao }}"
nix_permitir_nao_livres: true       # necessário para pacotes como Steam
nix_habilitar_flakes: false         # flakes são experimentais; mantido desligado por estabilidade

# ===== Steam =====
steam_habilitado: true
steam_pacote: steam
steam_atualizar_menu_kde: true

# Pacotes instalados no perfil do usuário (nix-env -iA nixpkgs.<attr>)
nix_pacotes_usuario: []            # ex.: [btop, steam]  (steam exige nix_permitir_nao_livres: true)
nix_atualizar_menu_kde: true       # roda kbuildsycoca6 após instalar pacotes
nix_instalar_atualizador_menu: true # instala o app Refresh Nix Apps

# ===== Mesa do Nix para apps FHS (Steam) =====
nix_opengl_habilitado: true         # cria /run/opengl-driver{,-32} no boot
nix_opengl_driver_teste: radeonsi_dri.so   # AMD. Intel: iris_dri.so | Nouveau: nouveau_dri.so

# ===== Rede =====
rede_habilitada: true                  # etapa atual: NetworkManager
rede_desabilitar_servicos_legados: true # troca do OpenRC legado para NetworkManager

# ===== Bluetooth =====
bluetooth_habilitado: true              # etapa atual: BlueZ + KDE
bluetooth_instalar_pipewire_spa_bluez: true  # suporte de áudio Bluetooth

# ===== Áudio =====
audio_habilitado: true                 # etapa atual: PipeWire + WirePlumber

# ===== Energia / SDDM =====
energia_habilitada: true                # elogind + polkit + ações no login
energia_configurar_sddm: true
energia_habilitar_hibernacao: true      # configura resume dinamicamente quando swapfile estiver disponível

# ===== Swap adicional =====
swap_habilitada: true
swapfile_caminho: /swapfile
swapfile_tamanho_gib: 12
swapfile_reserva_livre_gib: 2
swapfile_prioridade: -1

# ===== Fontes extras (apk) =====
fontes_habilitadas: true               # cobertura Unicode, CJK e emoji
fontes_pacotes_extras: []

# ===== KDE / OpenRC =====
kde_habilitado: true
kde_system_monitor_ocultar_aplicacoes: true
